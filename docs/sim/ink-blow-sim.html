<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INK / AIR — drop + blow simulator</title>
<style>
  :root {
    --bg: #111317; --panel: #1a1d22; --edge: #2a2e35;
    --txt: #d7d3c8; --dim: #8a8478; --acc: #f2600c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--txt);
    font-family: system-ui, sans-serif; min-height: 100vh;
    display: flex; flex-direction: column; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  header { padding: 12px 18px; border-bottom: 1px solid var(--edge);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header .logo { font-family: ui-monospace, Menlo, monospace; font-size: 14px;
    font-weight: 600; color: var(--acc); }
  header .sub { font-size: 12px; color: var(--dim); }
  header .views { margin-left: auto; display: flex; gap: 4px; }
  header .views button { padding: 4px 10px; font-size: 11px; cursor: pointer;
    border-radius: 3px; background: transparent; color: var(--txt);
    border: 1px solid var(--edge); font-family: inherit; }
  header .views button.on { background: var(--edge); }

  .wrap { display: flex; flex: 1; flex-wrap: wrap; }
  aside { width: 280px; min-width: 240px; flex: 0 0 auto; background: var(--panel);
    border-right: 1px solid var(--edge); padding: 16px; }
  main { flex: 1; min-width: 300px; padding: 16px; }

  .cap { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--dim); margin: 0 0 8px; }
  .seg { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .seg button { flex: 1 1 auto; padding: 6px 8px; font-size: 11px; cursor: pointer;
    font-family: inherit; background: transparent; color: var(--txt);
    border: 1px solid var(--edge); border-radius: 3px; }
  .seg button.on { background: var(--acc); color: #14100c; border-color: var(--acc); }

  .slider { margin-bottom: 14px; }
  .slider .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .slider .lab { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); }
  .slider .val { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--acc); height: 4px; }
  input[type=range]:focus-visible { outline: 2px solid var(--acc); outline-offset: 4px; }
  button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  #newseed { width: 100%; padding: 7px 0; margin-top: 4px; background: transparent;
    border: 1px solid var(--edge); border-radius: 3px; color: var(--txt);
    font-size: 11px; cursor: pointer; font-family: inherit; }

  .metrics { margin-top: 18px; }
  .metric { display: flex; justify-content: space-between; padding: 5px 0;
    border-bottom: 1px solid var(--edge); }
  .metric .k { font-size: 11px; color: var(--dim); }
  .metric .v { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .note { margin-top: 12px; font-size: 11px; line-height: 1.5; color: var(--dim); }

  .stage { width: 100%; height: min(78vh, 720px); border: 1px solid var(--edge); }
  .stage canvas { width: 100%; height: 100%; display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .cell { border: 1px solid var(--edge); }
  .cell .t { padding: 5px 8px; font-family: ui-monospace, Menlo, monospace;
    font-size: 10px; color: var(--dim); border-bottom: 1px solid var(--edge); }
  .cell canvas { width: 100%; height: 240px; display: block; }
</style>
</head>
<body>
<header>
  <span class="logo">INK / AIR</span>
  <span class="sub">drop + blow simulator — syringe dose, rotating nozzle stepper</span>
  <span class="views">
    <button id="v-single" class="on">Single</button>
    <button id="v-matrix">Ink &times; paper matrix</button>
  </span>
</header>

<div class="wrap">
  <aside>
    <p class="cap">Ink</p>
    <div class="seg" id="seg-ink"></div>
    <p class="cap">Paper</p>
    <div class="seg" id="seg-paper"></div>
    <div id="sliders"></div>
    <button id="newseed">New seed</button>
    <div class="metrics">
      <p class="cap">Readout</p>
      <div id="readout"></div>
    </div>
    <div class="note" id="note"></div>
  </aside>
  <main>
    <div class="stage" id="stage-single"><canvas id="cv"></canvas></div>
    <div class="grid" id="stage-matrix" style="display:none"></div>
  </main>
</div>

<script>
"use strict";
/* ============ deterministic RNG ============ */
function mulberry32(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;
  let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return((t^(t>>>14))>>>0)/4294967296;};}

/* ============ materials ============ */
const INKS = {
  india:      { label:"India ink (diluted)",   mu:3.0, film:0.6, thin:0.18, color:"#17171e", alpha:0.94,  granulation:0, bead:0.5 },
  acrylic:    { label:"Acrylic ink",           mu:28,  film:1.0, thin:0.35, color:"#0e0e13", alpha:0.985, granulation:0, bead:0.15 },
  watercolor: { label:"Pigmented watercolor",  mu:1.4, film:0.4, thin:0.11, color:"#27324e", alpha:0.5,   granulation:1, bead:0.7 },
};
const PAPERS = {
  yupo:   { label:"Yupo (non-absorbent)",        bg:"#f8f7f3", absorb:0,    feather:0, branchScale:1.0,  lockNote:"no edge lock — minutes to work" },
  cotton: { label:"Watercolor paper (absorbent)",bg:"#f4efe4", absorb:0.32, feather:1, branchScale:0.55, lockNote:"edge locks in ~5–15 s — blow immediately" },
};

/* ============ physics + geometry ============ */
function simulate(p){
  const ink=INKS[p.ink], paper=PAPERS[p.paper];
  const rng=mulberry32((p.seed*2654435761)>>>0);
  const V=p.volume;
  const soaked=V*paper.absorb*0.6;
  const Vwork=Math.max(1,V-soaked);
  const rPuddle=Math.sqrt(Vwork/(Math.PI*ink.film));
  const dirRad=p.blowDir*Math.PI/180;
  const drive=p.pressure*p.duration;
  const volF=Math.min(1.6,Math.max(0.35,Math.sqrt(V/55)));
  const Lmax=88*(drive/Math.sqrt(ink.mu))*paper.branchScale*volF;

  let nF=Math.round((2+9*p.pressure)*Math.pow(3/ink.mu,0.35)*(1+p.sweep/140)*Math.min(1.4,Math.sqrt(V/60)));
  nF=Math.max(2,Math.min(42,nF));

  const cone=(55+p.sweep)*Math.PI/180;
  const turb=0.28+0.5*Math.pow(3/ink.mu,0.4);
  const splitP=Math.min(0.09,0.028*Math.pow(3/ink.mu,0.5)*p.pressure);

  const branches=[];
  function grow(x,y,heading,len,w0,depth){
    const pts=[[x,y,w0]];
    let h=heading,traveled=0,w=w0;
    const step=1.4;
    while(traveled<len){
      h+=(rng()-0.5)*turb;
      const dh=Math.atan2(Math.sin(dirRad-h),Math.cos(dirRad-h));
      h+=dh*0.06;
      x+=Math.cos(h)*step; y+=Math.sin(h)*step;
      traveled+=step;
      w=w0*Math.pow(1-traveled/len,0.8)+0.12;
      pts.push([x,y,w]);
      if(depth<2&&traveled>len*0.25&&rng()<splitP){
        const side=rng()<0.5?1:-1;
        grow(x,y,h+side*(0.45+rng()*0.5),len*(0.3+rng()*0.3),w*0.7,depth+1);
      }
    }
    branches.push({pts,end:[x,y]});
  }
  for(let i=0;i<nF;i++){
    const a=dirRad+(rng()-0.5)*cone;
    const sx=Math.cos(a)*rPuddle*0.82, sy=Math.sin(a)*rPuddle*0.82;
    const L=Lmax*(0.3+0.7*Math.pow(rng(),0.75));
    const w0=Math.max(0.5,rPuddle*(0.10+rng()*0.12));
    grow(sx,sy,a,L,w0,0);
  }

  let branchVol=0;
  for(const b of branches){
    let len=0,wSum=0;
    for(let i=1;i<b.pts.length;i++){
      len+=Math.hypot(b.pts[i][0]-b.pts[i-1][0],b.pts[i][1]-b.pts[i-1][1]);
      wSum+=b.pts[i][2];
    }
    branchVol+=len*(wSum/Math.max(1,b.pts.length))*ink.thin;
  }
  let scale=1;
  if(branchVol>Vwork*0.75)scale=(Vwork*0.75)/branchVol;
  if(scale<1){
    for(const b of branches){
      const keep=Math.max(2,Math.floor(b.pts.length*scale));
      b.pts=b.pts.slice(0,keep);
      b.end=[b.pts[keep-1][0],b.pts[keep-1][1]];
    }
    branchVol*=scale;
  }
  const remain=Math.max(2,Vwork-branchVol);
  const rAfter=Math.sqrt(remain/(Math.PI*ink.film));
  const shift=rPuddle*0.22;

  let reach=0,minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const b of branches)for(const q of b.pts){
    const d=Math.hypot(q[0],q[1]);
    if(d>reach)reach=d;
    if(q[0]<minX)minX=q[0]; if(q[0]>maxX)maxX=q[0];
    if(q[1]<minY)minY=q[1]; if(q[1]>maxY)maxY=q[1];
  }
  minX=Math.min(minX,-rPuddle);maxX=Math.max(maxX,rPuddle);
  minY=Math.min(minY,-rPuddle);maxY=Math.max(maxY,rPuddle);

  return { ink,paper,branches,rPuddle,rAfter,shift,dirRad,
    metrics:{ dropDia:2*rPuddle, reach, covW:maxX-minX, covH:maxY-minY,
      usedPct:Math.round(100*(branchVol+soaked)/V),
      soakedPct:Math.round(100*soaked/V),
      fingers:branches.length } };
}

/* ============ rendering ============ */
function drawBody(ctx,sim,X,Y,s,widen){
  const {ink,branches,rAfter,shift,dirRad}=sim;
  ctx.strokeStyle=ink.color; ctx.fillStyle=ink.color;
  for(const b of branches){
    for(let i=1;i<b.pts.length;i++){
      const a=b.pts[i-1],q=b.pts[i];
      ctx.lineWidth=Math.max(0.6,q[2]*s*widen);
      ctx.beginPath();
      ctx.moveTo(X(a[0]),Y(a[1]));
      ctx.lineTo(X(q[0]),Y(q[1]));
      ctx.stroke();
    }
  }
  const prng=mulberry32(991);
  const cxm=Math.cos(dirRad)*shift, cym=Math.sin(dirRad)*shift;
  ctx.beginPath();
  const N=44;
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const stretch=1+0.22*Math.cos(a-dirRad);
    const r=rAfter*stretch*(0.94+prng()*0.12)*widen;
    const px=X(cxm+Math.cos(a)*r), py=Y(cym+Math.sin(a)*r);
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
}

function render(canvas,p,sim,opts){
  opts=opts||{};
  const dpr=window.devicePixelRatio||1;
  const cw=canvas.clientWidth, ch=canvas.clientHeight;
  if(!cw||!ch)return;
  canvas.width=cw*dpr; canvas.height=ch*dpr;
  const ctx=canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const {ink,paper,branches,rPuddle,dirRad}=sim;
  const viewMM=Math.max(80,Math.max(sim.metrics.covW,sim.metrics.covH)+30);
  const s=Math.min(cw,ch)/viewMM;
  const cx=cw/2, cy=ch/2;
  const X=mx=>cx+mx*s, Y=my=>cy+my*s;

  ctx.fillStyle=paper.bg;
  ctx.fillRect(0,0,cw,ch);
  const trng=mulberry32(7);
  ctx.fillStyle="rgba(120,105,80,0.05)";
  const grains=paper.feather?900:350;
  for(let i=0;i<grains;i++)ctx.fillRect(trng()*cw,trng()*ch,1,1);

  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.globalAlpha=1;

  if(paper.feather){
    ctx.save();
    ctx.filter="blur("+Math.max(1.5,1.2*s)+"px)";
    ctx.globalAlpha=0.35*ink.alpha;
    drawBody(ctx,sim,X,Y,s,1.15);
    ctx.restore();
  }
  ctx.globalAlpha=ink.alpha;
  drawBody(ctx,sim,X,Y,s,1);
  ctx.globalAlpha=1;

  if(!paper.feather){
    const brng=mulberry32((p.seed^0x9e37)>>>0);
    ctx.fillStyle=ink.color;
    ctx.globalAlpha=ink.alpha;
    for(const b of branches)if(brng()<ink.bead){
      ctx.beginPath();
      ctx.arc(X(b.end[0]),Y(b.end[1]),Math.max(1,0.7*s),0,7);
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  if(ink.granulation){
    const grng=mulberry32((p.seed^0x51f)>>>0);
    ctx.globalAlpha=0.28;
    ctx.fillStyle=ink.color;
    for(const b of branches)for(const q of b.pts)if(grng()<0.3)
      ctx.fillRect(X(q[0])+(grng()-0.5)*3,Y(q[1])+(grng()-0.5)*3,1.2,1.2);
    ctx.globalAlpha=1;
  }

  if(opts.overlay===false)return;

  /* nozzle protractor overlay */
  const oc="#f2600c";
  const R=rPuddle*s+Math.max(16,8*s*0.4)+14;
  ctx.strokeStyle=oc; ctx.fillStyle=oc;
  ctx.lineWidth=1;
  ctx.setLineDash([2,4]);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  const nz=dirRad+Math.PI;
  const half=p.sweep/2*Math.PI/180;
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(cx,cy,R,nz-half,nz+half); ctx.stroke();
  const nx=cx+Math.cos(nz)*R, ny=cy+Math.sin(nz)*R;
  ctx.beginPath(); ctx.arc(nx,ny,4.5,0,7); ctx.fill();
  ctx.lineWidth=1.5;
  const ax=cx+Math.cos(nz)*(R-10), ay=cy+Math.sin(nz)*(R-10);
  const bx=cx+Math.cos(dirRad)*(rPuddle*s*0.4);
  const by=cy+Math.sin(dirRad)*(rPuddle*s*0.4);
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  const ah=Math.atan2(by-ay,bx-ax);
  ctx.beginPath();
  ctx.moveTo(bx,by);
  ctx.lineTo(bx-7*Math.cos(ah-0.4),by-7*Math.sin(ah-0.4));
  ctx.lineTo(bx-7*Math.cos(ah+0.4),by-7*Math.sin(ah+0.4));
  ctx.fill();
  const bl=20*s;
  ctx.strokeStyle="#8a8478"; ctx.fillStyle="#8a8478";
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(cw-16-bl,ch-16); ctx.lineTo(cw-16,ch-16); ctx.stroke();
  ctx.font="10px ui-monospace, Menlo, monospace";
  ctx.textAlign="right";
  ctx.fillText("20 mm",cw-16,ch-22);
}

/* ============ state + UI ============ */
const P = { ink:"india", paper:"yupo", volume:80, pressure:1.0,
  duration:1.0, blowDir:20, sweep:30, seed:7 };
let VIEW="single";

const SLIDERS=[
  ["volume","Dose"," µl",10,500,5],
  ["pressure","Air pressure"," bar",0.2,2,0.05],
  ["duration","Blow duration"," s",0.2,3,0.1],
  ["blowDir","Blow direction","°",0,360,1],
  ["sweep","Nozzle sweep","°",0,180,5],
  ["seed","Seed","",1,99,1],
];

function el(tag,cls,html){const e=document.createElement(tag);
  if(cls)e.className=cls; if(html!==undefined)e.innerHTML=html; return e;}

function buildSeg(id,items,key){
  const box=document.getElementById(id);
  box.innerHTML="";
  for(const [k,lab] of items){
    const b=el("button",P[key]===k?"on":"",lab);
    b.onclick=()=>{P[key]=k;buildSeg(id,items,key);update();};
    box.appendChild(b);
  }
}
function buildSliders(){
  const box=document.getElementById("sliders");
  box.innerHTML="";
  for(const [key,label,unit,min,max,step] of SLIDERS){
    const d=el("div","slider");
    const row=el("div","row");
    row.appendChild(el("span","lab",label));
    const val=el("span","val",P[key]+unit);
    row.appendChild(val);
    d.appendChild(row);
    const inp=document.createElement("input");
    inp.type="range"; inp.min=min; inp.max=max; inp.step=step; inp.value=P[key];
    inp.setAttribute("aria-label",label);
    inp.oninput=()=>{P[key]=parseFloat(inp.value);val.textContent=P[key]+unit;update();};
    d.appendChild(inp);
    box.appendChild(d);
  }
}
function fmt(x){return (Math.round(x*10)/10).toFixed(1);}
function readout(m){
  const rows=[
    ["Puddle Ø (pre-blow)",fmt(m.dropDia)+" mm"],
    ["Max reach from center",fmt(m.reach)+" mm"],
    ["Coverage",fmt(m.covW)+" × "+fmt(m.covH)+" mm"],
    ["Fingers",m.fingers],
    ["Ink leaving puddle",m.usedPct+" %"],
    ["Soaked into paper",m.soakedPct+" %"],
  ];
  const box=document.getElementById("readout");
  box.innerHTML="";
  for(const [k,v] of rows){
    const d=el("div","metric");
    d.appendChild(el("span","k",k));
    d.appendChild(el("span","v",String(v)));
    box.appendChild(d);
  }
  document.getElementById("note").textContent =
    PAPERS[P.paper].lockNote+". μ ≈ "+INKS[P.ink].mu+" mPa·s, film ≈ "+INKS[P.ink].film+" mm.";
}

function buildMatrix(){
  const g=document.getElementById("stage-matrix");
  g.innerHTML="";
  for(const ik of Object.keys(INKS))for(const pk of Object.keys(PAPERS)){
    const cell=el("div","cell");
    cell.appendChild(el("div","t",INKS[ik].label+" · "+PAPERS[pk].label));
    const c=document.createElement("canvas");
    c.dataset.ink=ik; c.dataset.paper=pk;
    cell.appendChild(c);
    g.appendChild(cell);
  }
}

function update(){
  if(VIEW==="single"){
    const sim=simulate(P);
    render(document.getElementById("cv"),P,sim);
    readout(sim.metrics);
  }else{
    let mainSim=null;
    document.querySelectorAll("#stage-matrix canvas").forEach(c=>{
      const q=Object.assign({},P,{ink:c.dataset.ink,paper:c.dataset.paper});
      const sim=simulate(q);
      render(c,q,sim,{overlay:false});
      if(c.dataset.ink===P.ink&&c.dataset.paper===P.paper)mainSim=sim;
    });
    readout((mainSim||simulate(P)).metrics);
  }
}

function setView(v){
  VIEW=v;
  document.getElementById("v-single").classList.toggle("on",v==="single");
  document.getElementById("v-matrix").classList.toggle("on",v==="matrix");
  document.getElementById("stage-single").style.display=v==="single"?"":"none";
  document.getElementById("stage-matrix").style.display=v==="matrix"?"":"none";
  update();
}

document.getElementById("v-single").onclick=()=>setView("single");
document.getElementById("v-matrix").onclick=()=>setView("matrix");
document.getElementById("newseed").onclick=()=>{
  P.seed=Math.floor(Math.random()*99)+1;
  buildSliders(); update();
};
window.addEventListener("resize",update);

buildSeg("seg-ink",[["india","India"],["acrylic","Acrylic"],["watercolor","Watercolor"]],"ink");
buildSeg("seg-paper",[["yupo","Yupo"],["cotton","Watercolor paper"]],"paper");
buildSliders();
buildMatrix();
update();
</script>
</body>
</html>
