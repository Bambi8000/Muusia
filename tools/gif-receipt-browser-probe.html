   for(const transparent of [false,true])for(const larger of [false,true])for(const transparentClear of [false,true]){const variant=bytes.slice();variant[11]=2;if(larger){variant[6]=24;variant[8]=20;}if(transparent)variant[13+meta.global.length+3]|=1;const offset=13+meta.global.length+meta.frames.slice(0,2).reduce((n,f)=>n+18+f.palette.length+f.data.length,0)+3;if(!transparentClear)variant[offset]&=254;const m=N._meta(variant);eq(await N._decodeNative(variant,m),await N._decodePatches(variant,m),'nonwhite background, first-frame transparency '+transparent+', larger canvas '+larger+', transparent disposal '+transparentClear);}
  }

 }

 for(const height of [100,620])eq(renderReceiptRaster(oldPaths,72,height),before(oldPaths,72,height),'legacy receipt byte parity '+height+' mm');
 const thin=renderReceiptRaster([{pts:[[5,10],[65,10]],receiptStrokeWidth:.12}],72,20),thick=renderReceiptRaster([{pts:[[5,10],[65,10]],receiptStrokeWidth:2}],72,20);

 function show(r){const c=document.createElement('canvas');c.width=r.width;c.height=r.height;const g=c.getContext('2d'),d=g.createImageData(r.width,r.height),s=atob(r.data);for(let y=0;y<r.height;y++)for(let x=0;x<r.width;x++){const v=s.charCodeAt(y*64+(x>>3))&(128>>(x&7))?0:255,k=(y*r.width+x)*4;d.data.set([v,v,v,255],k);}g.putImageData(d,0,0);document.querySelector('#images').append(c);}
