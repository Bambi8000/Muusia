# ============================================================
# Muusia — laser-guided pen offset calibration (Klipper macros)
# Target: X-Carve / BTT Kraken build, KlipperScreen on the RPi.
#
# Workflow (all on the touchscreen):
#   1. PEN_CAL_MARK        pen draws a small cross at the cal point,
#                          carriage parks aside, laser turns ON
#   2. Move panel          jog until the laser dot sits on the cross center
#   3. PEN_CAL_SAVE        opens a button dialog -> tap "Pen n" to store
#      (or PEN_CAL_SET PEN=n directly from the Macros panel)
#   Repeat 1-3 for every pen you want matched.
#   4. PEN_USE PEN=n       before plotting with pen n: applies
#      [REF=m]             SET_GCODE_OFFSET so pen n follows the same
#                          line as reference pen m (default REF=1)
#   PEN_CAL_CLEAR          zero the gcode offset again
#
# Notes:
#   - Offsets persist in variables.cfg via [save_variables].
#   - Saving the REFERENCE pen also yields the Muusia machine-profile
#     laser offset: laserOffX = -dx, laserOffY = -dy (printed in the
#     console message).
#   - Tape/magnet the paper down: it must not move between steps 1 and 3.
#   - Do NOT run PEN_USE between MARK and SAVE (MARK zeroes the offset,
#     and the math assumes it stays zero while you jog).
# ============================================================

[save_variables]
filename: ~/printer_data/config/muusia_vars.cfg

[output_pin laser]
# TODO: real pin once the laser is wired to the Kraken
pin: PLACEHOLDER_PIN
value: 0
shutdown_value: 0

# ---- pen lift stubs — replace with the real servo/Z macros ----
[gcode_macro PEN_UP]
gcode:
  SET_SERVO SERVO=pen ANGLE=90

[gcode_macro PEN_DOWN]
gcode:
  SET_SERVO SERVO=pen ANGLE=30

# ---- calibration point + mark geometry (edit to taste) ----
[gcode_macro _PEN_CAL]
variable_cal_x: 150.0      # calibration point, machine coords (mm)
variable_cal_y: 150.0
variable_cross: 4.0        # cross arm length mm (0 = plain dot)
variable_park_dx: 40.0     # step aside after marking so the mark is visible
variable_feed: 6000
variable_feed_draw: 1500
gcode:

[gcode_macro PEN_CAL_MARK]
description: Pen cal 1/3 — draw a cross at the cal point, laser ON
gcode:
  {% set c = printer["gcode_macro _PEN_CAL"] %}
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  SET_GCODE_OFFSET X=0 Y=0
  G90
  PEN_UP
  G1 X{c.cal_x} Y{c.cal_y} F{c.feed}
  {% if c.cross > 0 %}
    G1 X{c.cal_x - c.cross/2} F{c.feed}
    PEN_DOWN
    G4 P150
    G1 X{c.cal_x + c.cross/2} F{c.feed_draw}
    PEN_UP
    G1 X{c.cal_x} Y{c.cal_y - c.cross/2} F{c.feed}
    PEN_DOWN
    G4 P150
    G1 Y{c.cal_y + c.cross/2} F{c.feed_draw}
    PEN_UP
  {% else %}
    PEN_DOWN
    G4 P250
    PEN_UP
  {% endif %}
  G1 X{c.cal_x + c.park_dx} Y{c.cal_y} F{c.feed}
  SAVE_VARIABLE VARIABLE=pencal_ref_x VALUE={c.cal_x}
  SAVE_VARIABLE VARIABLE=pencal_ref_y VALUE={c.cal_y}
  SET_PIN PIN=laser VALUE=1
  RESPOND MSG="Jog the laser dot onto the cross center, then tap PEN_CAL_SAVE"

[gcode_macro PEN_CAL_SAVE]
description: Pen cal 3/3 — pick which pen to save (touch dialog)
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Save offset to which pen?"
  {% for n in range(1, 9) %}
    RESPOND TYPE=command MSG="action:prompt_button Pen {n}|PEN_CAL_SET PEN={n}"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro PEN_CAL_SET]
description: Store offset for PEN=n (laser is on the mark)
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  {% set n = params.PEN|default(1)|int %}
  {% set sv = printer.save_variables.variables %}
  {% if 'pencal_ref_x' not in sv %}
    { action_raise_error("Run PEN_CAL_MARK first") }
  {% endif %}
  {% set dx = printer.gcode_move.gcode_position.x - sv.pencal_ref_x %}
  {% set dy = printer.gcode_move.gcode_position.y - sv.pencal_ref_y %}
  SAVE_VARIABLE VARIABLE=pen_{n}_dx VALUE={dx|round(3)}
  SAVE_VARIABLE VARIABLE=pen_{n}_dy VALUE={dy|round(3)}
  SET_PIN PIN=laser VALUE=0
  RESPOND MSG="Pen {n} saved: dx={dx|round(3)} dy={dy|round(3)} — Muusia laserOff (if this is the ref pen): X={(-dx)|round(3)} Y={(-dy)|round(3)}"

[gcode_macro PEN_USE]
description: Apply stored offset so PEN=n follows REF=m (default 1)
gcode:
  {% set n = params.PEN|int %}
  {% set r = params.REF|default(1)|int %}
  {% set sv = printer.save_variables.variables %}
  {% if ('pen_' ~ n ~ '_dx') not in sv %}
    { action_raise_error("Pen " ~ n ~ " not calibrated") }
  {% endif %}
  {% if ('pen_' ~ r ~ '_dx') not in sv %}
    { action_raise_error("Reference pen " ~ r ~ " not calibrated") }
  {% endif %}
  {% set ox = sv['pen_' ~ r ~ '_dx']|float - sv['pen_' ~ n ~ '_dx']|float %}
  {% set oy = sv['pen_' ~ r ~ '_dy']|float - sv['pen_' ~ n ~ '_dy']|float %}
  SET_GCODE_OFFSET X={ox|round(3)} Y={oy|round(3)} MOVE=0
  RESPOND MSG="Pen {n} active: offset X={ox|round(3)} Y={oy|round(3)} (ref pen {r})"

[gcode_macro PEN_CAL_CLEAR]
description: Zero the gcode offset
gcode:
  SET_GCODE_OFFSET X=0 Y=0
  RESPOND MSG="Gcode offset zeroed"
