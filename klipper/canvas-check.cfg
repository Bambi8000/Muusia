# =============================================================================
# Canvas check — trace the drawing bounds with the laser before plotting.
# Muusia's G-code export emits this at job start (bounds + laser offset baked
# in by the exporter); it can also be run by hand from the console.
#
#   CANVAS_CHECK X_MIN=100 X_MAX=350 Y_MIN=80 Y_MAX=290
#                [LASER_OFF_X=0] [LASER_OFF_Y=0]   laser offset from pen tip (mm)
#                [SPEED=120]                        trace speed (mm/s)
#                [LOOPS=2]                          how many times around
#                [PROMPT=1]                         pause + Continue/Abort dialog
#                                                   (only when a job is active)
#
# The laser dot follows the DRAWING bounds: the toolhead moves to
# (bound − laser offset). Refuses to run unhomed or if the frame exceeds
# machine travel — which doubles as an "oversized job" guard.
#
# Requirements:
# - PEN_UP macro (printer.cfg) — pen is lifted before tracing.
# - [output_pin laser] — TODO until the Kraken is wired (same pin the magnet
#   jig and pen-cal use). Without it the frame is traced laser-dark with a
#   console note, so the macro stays testable.
# - Prompts need [respond]. pen-cal.cfg likely defines it already; check with
#     grep -l respond ~/printer_data/config/*.cfg
#   and if nothing matches, uncomment the section below.
#
#[respond]
# =============================================================================

[gcode_macro CANVAS_CHECK]
description: Trace drawing bounds with the laser (pen up) before plotting
gcode:
  {% set xmin = params.X_MIN|float %}
  {% set xmax = params.X_MAX|float %}
  {% set ymin = params.Y_MIN|float %}
  {% set ymax = params.Y_MAX|float %}
  {% set lox = params.LASER_OFF_X|default(0)|float %}
  {% set loy = params.LASER_OFF_Y|default(0)|float %}
  {% set speed = params.SPEED|default(120)|float * 60 %}
  {% set loops = params.LOOPS|default(2)|int %}
  {% set x0 = xmin - lox %}
  {% set x1 = xmax - lox %}
  {% set y0 = ymin - loy %}
  {% set y1 = ymax - loy %}
  {% if "xy" not in printer.toolhead.homed_axes %}
    { action_raise_error("CANVAS_CHECK: home X and Y first (G28)") }
  {% endif %}
  {% set cfg = printer.configfile.settings %}
  {% set ox = printer.gcode_move.homing_origin.x %}
  {% set oy = printer.gcode_move.homing_origin.y %}
  {% if x0 + ox < cfg.stepper_x.position_min or x1 + ox > cfg.stepper_x.position_max
     or y0 + oy < cfg.stepper_y.position_min or y1 + oy > cfg.stepper_y.position_max %}
    { action_raise_error("CANVAS_CHECK: frame at machine X%.0f..%.0f Y%.0f..%.0f exceeds travel - wrong zero corner, PAPER_ZERO not on the paper, or job too large" % (x0+ox, x1+ox, y0+oy, y1+oy)) }
  {% endif %}
  SAVE_GCODE_STATE NAME=canvas_check
  PEN_UP
  G90
  G0 X{x0} Y{y0} F{speed}
  _CC_LASER_ON
  {% for i in range(loops) %}
    G0 X{x1} Y{y0} F{speed}
    G0 X{x1} Y{y1} F{speed}
    G0 X{x0} Y{y1} F{speed}
    G0 X{x0} Y{y0} F{speed}
  {% endfor %}
  _CC_LASER_OFF
  RESTORE_GCODE_STATE NAME=canvas_check
  {% if printer.virtual_sdcard.is_active and params.PROMPT|default(1)|int %}
    PAUSE
    _CC_PROMPT
  {% endif %}

[gcode_macro _CC_LASER_ON]
gcode:
  {% if "output_pin laser" in printer.configfile.settings %}
    SET_PIN PIN=laser VALUE=1
  {% else %}
    M117 canvas check: laser pin not configured, tracing dark
  {% endif %}

[gcode_macro _CC_LASER_OFF]
gcode:
  {% if "output_pin laser" in printer.configfile.settings %}
    SET_PIN PIN=laser VALUE=0
  {% endif %}

[gcode_macro _CC_PROMPT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Canvas check"
  RESPOND TYPE=command MSG="action:prompt_text Did the laser frame fit the paper?"
  RESPOND TYPE=command MSG="action:prompt_footer_button Continue|RESUME|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Abort|CANCEL_PRINT|error"
  RESPOND TYPE=command MSG="action:prompt_show"
