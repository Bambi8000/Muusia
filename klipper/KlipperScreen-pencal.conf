# Optional: dedicated "Pen Cal" menu in KlipperScreen (append to KlipperScreen.conf).
# Not strictly needed — all macros already appear in the Macros panel —
# but this gives big one-tap buttons in the intended order.

[menu __main pencal]
name: Pen Cal
icon: fine-tune

[menu __main pencal mark]
name: 1. Mark + laser
icon: move
method: printer.gcode.script
params: {"script": "PEN_CAL_MARK"}

[menu __main pencal save]
name: 2. Save to pen...
icon: complete
method: printer.gcode.script
params: {"script": "PEN_CAL_SAVE"}

[menu __main pencal clear]
name: Clear offset
icon: refresh
method: printer.gcode.script
params: {"script": "PEN_CAL_CLEAR"}
