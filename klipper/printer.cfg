# =============================================================================
# Muusia Plotter — BTT Kraken v1.1 + Klipper
# Machine: salvaged X-Carve/C-Carve frame (~1 m x 1 m), pen/brush plotter
# Host: Raspberry Pi 4 (Klipper + Moonraker + Mainsail + KlipperScreen)
# Firmware: STM32H723, 128KiB bootloader, 25 MHz crystal, USB (PA11/PA12)
#
# Pin mappings from the official BTT reference:
#   github.com/bigtreetech/BIGTREETECH-Kraken (generic-bigtreetech-kraken.cfg)
#
# Motor slot plan (S1-S4 are the 8 A slots, S5-S8 the 3 A slots):
#   S1 = X        (gantry cross-travel)
#   S2 = Y  left  (has its own endstop -> auto-square)
#   S3 = Y1 right (has its own endstop -> auto-square)
#   S4 = Z        (coarse tool height; fast pen lift is the servo)
#   S5 = brush rotation (manual_stepper, added later)
#
# Steppers: NEMA23 SM57HT51-2804AF, 1.8 deg, 2.8 A/phase max.
#   Run at ~1.4 A RMS (moderate current per BOM decision, PSU = 24 V / 21 A).
#
# !!! Values marked TODO must be verified on the real machine before homing.
# =============================================================================

#[include timelapse.cfg]   # DISABLED: its TIMELAPSE_TAKE_FRAME does SET_GCODE_OFFSET X=0 Y=0, wiping PAPER_ZERO mid-job (drawing jumped 42/20 onto the Z block). Telegram bot handles timelapse without moving anything.
[include mainsail.cfg]
[include canvas-check.cfg]

[mcu]
# TODO: replace with the real ID after flashing the Kraken:
#   ls /dev/serial/by-id/*
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_27001D001851313430323835-if00

[printer]
kinematics: cartesian
max_velocity: 60          # long F6000 travels lost steps on decel (281mm hop at path 36)
max_accel: 500          # heavy X-Carve gantry on NEMA23 - 1500 skipped steps (chatter then drift)
max_z_velocity: 5               # ACME screw resonates above ~5 mm/s (tested)
max_z_accel: 60

# Allow FORCE_MOVE / SET_KINEMATIC_POSITION during bring-up
[force_move]
enable_force_move: True

# Arc support (G2/G3) — harmless to have, useful if a G-code path uses arcs
[gcode_arcs]
resolution: 0.1

[idle_timeout]
timeout: 1800
gcode:
  PEN_UP
  PEN_RELEASE
  M84

# -----------------------------------------------------------------------------
# X axis — slot S1
# -----------------------------------------------------------------------------
[stepper_x]
step_pin: PC14
dir_pin: PC13                  # TODO: flip with ! if X moves the wrong way
enable_pin: !PE6
microsteps: 16
rotation_distance: 40          # TODO: verify. X-Carve GT2 belt + 20T pulley = 40 mm/rev
full_steps_per_rotation: 200
endstop_pin: ^PC15             # S1 endstop header (STOP0). TODO: verify switch wiring (NC recommended)
position_endstop: 0
position_min: 0
position_max: 793
homing_speed: 30
homing_retract_dist: 5

[tmc5160 stepper_x]            # TMC2160 is configured via the tmc5160 driver
cs_pin: PD6
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.4
sense_resistor: 0.022
stealthchop_threshold: 999999

# -----------------------------------------------------------------------------
# Y axis, left motor — slot S2
# -----------------------------------------------------------------------------
[stepper_y]
step_pin: PE5
dir_pin: PE4                   # TODO: verify direction
enable_pin: !PE3
microsteps: 16
rotation_distance: 40          # TODO: verify (same belt/pulley as X)
full_steps_per_rotation: 200
endstop_pin: ^PF0              # S2 endstop header (STOP1), left side of gantry
position_endstop: 0
position_min: 0
position_max: 813
homing_speed: 30
homing_retract_dist: 5

[tmc5160 stepper_y]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.4
sense_resistor: 0.022
stealthchop_threshold: 999999

# -----------------------------------------------------------------------------
# Y axis, right motor — slot S3
# No endstop_pin -> both Y motors home together against the single Y switch.
# Gantry squareness comes from mechanical setup at power-on (steppers hold it).
# FUTURE auto-square options: (a) add a second microswitch to STOP2 (PF1) and
# give this stepper `endstop_pin: ^PF1`, or (b) sensorless homing via TMC2160
# DIAG. Either makes Klipper home the two Y motors independently.
# NOTE: one Y motor usually needs inverted dir_pin because it is mirrored.
# -----------------------------------------------------------------------------
[stepper_y1]
step_pin: PE2
dir_pin: !PE1                  # TODO: verify — mirrored motor, likely inverted vs stepper_y
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200

[tmc5160 stepper_y1]
cs_pin: PD4
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.4
sense_resistor: 0.022
stealthchop_threshold: 999999

# -----------------------------------------------------------------------------
# Z axis — slot S4 (coarse height; the servo does the fast pen lift)
# Real Z endstop on MIN3 (PF1, NC) at the TOP of travel, added 2026-08-24.
# G28 Z homes upward, which also lifts the pen clear of the paper; work zero
# (pen contact height) is still a gcode offset set by Z_ZERO_HERE.
# -----------------------------------------------------------------------------
[stepper_z]
step_pin: PB9
dir_pin: !PB8                   # verified: Z+ = up
enable_pin: !PB7
microsteps: 16
rotation_distance: 2.117       # verified by measurement (10 mm commanded = 10 mm). X-Carve ACME 3/8"-12 leadscrew ~= 2.117 mm/rev
full_steps_per_rotation: 200
endstop_pin: ^PF1              # MIN3 header, NC switch at the TOP of travel
position_endstop: 75             # switch trigger point, measured 2026-08-24
homing_positive_dir: true
position_min: 0
position_max: 75
homing_speed: 5              # only 2 mm from trigger to the mechanical end

second_homing_speed: 2
homing_retract_dist: 10             # lever stays depressed for 3-6 mm
[homing_override]
axes: xyz
gcode:
  {% set want = params.X is defined or params.Y is defined or params.Z is defined %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if not want or params.Z is defined %}
    G28 Z
  {% elif 'z' not in homed %}
    G28 Z
  {% endif %}
  {% if not want or params.X is defined %}
    G28 X
  {% endif %}
  {% if not want or params.Y is defined %}
    G28 Y
  {% endif %}

[tmc5160 stepper_z]
cs_pin: PD3
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.4
sense_resistor: 0.022
stealthchop_threshold: 999999

# -----------------------------------------------------------------------------
# Brush rotation — slot S5 (5th stepper, uncomment when the tool exists)
# -----------------------------------------------------------------------------
#[manual_stepper brush]
#step_pin: PG9
#dir_pin: PG10
#enable_pin: !PG13
#microsteps: 16
#rotation_distance: 360        # degrees per revolution -> MOVE=degrees
#velocity: 90
#
#[tmc5160 manual_stepper brush]
#cs_pin: PD2
#spi_software_sclk_pin: PC6
#spi_software_mosi_pin: PC8
#spi_software_miso_pin: PC7
#run_current: 1.0
#sense_resistor: 0.075         # NOTE: S5-S8 slots use 0.075 ohm sense resistors
#stealthchop_threshold: 999999

# -----------------------------------------------------------------------------
# Pen lift servo — SURPASS Hobby S0017M on the servo header
# Power the servo from 5 V, NOT from motor voltage.
# -----------------------------------------------------------------------------
[servo pen]
pin: PE7                       # SERVOS header, verified 2026-08-24
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 135             # pen UP on boot

# -----------------------------------------------------------------------------
# Status LEDs — WS2812 Neopixels (traffic-light state logic)
# -----------------------------------------------------------------------------
#[neopixel status]
#pin: PF12                     # RGB1 header
#chain_count: 8                # TODO: set real LED count
#color_order: GRB
#initial_RED: 0.0
#initial_GREEN: 0.1
#initial_BLUE: 0.0

# -----------------------------------------------------------------------------
# Monitoring — no heaters on this machine, but temps are nice on the dashboard
# -----------------------------------------------------------------------------
[temperature_sensor kraken_mcu]
sensor_type: temperature_mcu

[temperature_sensor raspberry_pi]
sensor_type: temperature_host

# -----------------------------------------------------------------------------
# Pen macros — tune angles on the real mechanism, then keep them ONLY here
# so exported G-code stays hardware-agnostic (PEN_UP / PEN_DOWN).
# -----------------------------------------------------------------------------
[gcode_macro PEN_UP]
gcode:
  SET_SERVO SERVO=pen ANGLE={printer["gcode_macro _PEN_VARS"].up_angle}
  G4 P250

[gcode_macro PEN_DOWN]
gcode:
  SET_SERVO SERVO=pen ANGLE={printer["gcode_macro _PEN_VARS"].down_angle}
  G4 P250

[gcode_macro _PEN_VARS]
variable_up_angle: 135         # tuned on the real linkage 2026-08-24
variable_down_angle: 80        # spring just compressed at this angle
gcode:

# Release servo PWM (stops holding torque / jitter when parked)
[gcode_macro PEN_RELEASE]
gcode:
  SET_SERVO SERVO=pen WIDTH=0

# Convenience: re-declare the current Z position as 0 without re-homing X/Y
# (use after jogging Z to a new working height)
[gcode_macro Z_ZERO_HERE]
gcode:
  SET_KINEMATIC_POSITION Z=0

# -----------------------------------------------------------------------------
# Paper origin — work coordinate system for job placement.
# Workflow: G28 -> put the paper down -> jog the tool (later: laser dot) to the
# paper corner that is the job's (0,0) -> press PAPER_ZERO. All job coordinates
# are now measured from that corner; the Muusia profile keeps Origin X/Y at 0.
# The offset survives G28 X Y; it is cleared by PAPER_ZERO_CLEAR or a
# FIRMWARE_RESTART. NOTE: canvas-check's travel guard compares unshifted
# bounds — an offset job that would exceed travel is still stopped safely by
# Klipper's own "Move out of range" during the frame trace (pen up).
# -----------------------------------------------------------------------------
[gcode_macro PAPER_ZERO]
description: Mark current XY as paper origin (job 0,0)
gcode:
  {% if "xy" not in printer.toolhead.homed_axes %}
    { action_raise_error("PAPER_ZERO: home X and Y first (G28)") }
  {% endif %}
  SET_GCODE_OFFSET X={printer.toolhead.position.x} Y={printer.toolhead.position.y}
  M117 Paper zero: X{printer.toolhead.position.x|round(1)} Y{printer.toolhead.position.y|round(1)}

[gcode_macro PAPER_ZERO_CLEAR]
description: Clear paper origin and paper-Z offsets (back to machine coordinates)
gcode:
  SET_GCODE_OFFSET X=0 Y=0 Z=0
  M117 Paper zero cleared (XY and Z)

# -----------------------------------------------------------------------------
# Z from the setup block — no marks on the paper.
# Workflow: place the 8 mm block ON the paper, jog Z down (pen in DOWN pose)
# until the tip just touches the block top, press Z_PAPER_BLOCK. The macro
# declares that height as Z = 9, so Z0 = the paper surface underneath.
# REMOVE THE BLOCK before PEN_UP / starting the job: PEN_UP goes to Z5, which
# is BELOW the block top (9) and would press the pen into the block.
# Block height lives in block_h below — edit if you switch to another block.
# -----------------------------------------------------------------------------
[gcode_macro Z_PAPER_BLOCK]
description: Pen tip touching the 8 mm block on paper -> work Z0 = paper (gcode offset)
variable_block_h: 8.0
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
    { action_raise_error("Z_PAPER_BLOCK: home Z first (G28)") }
  {% endif %}
  {% if printer.toolhead.position.z > 55.0 %}
    { action_raise_error("Z_PAPER_BLOCK: machine Z %.1f is too high - jog the pen tip down onto the block first" % printer.toolhead.position.z) }
  {% endif %}
  SET_GCODE_OFFSET Z={printer.toolhead.position.z - printer["gcode_macro Z_PAPER_BLOCK"].block_h}
  M117 Z offset set: block top = work Z{printer["gcode_macro Z_PAPER_BLOCK"].block_h}, paper = work Z0. REMOVE BLOCK.

[gcode_macro PLOT_START]
description: One-button setup - home, measure fixed Z block, stay on block, declare paper origin
variable_block_z: 19.0
variable_paper_x: 42.0
variable_paper_y: 20.0
gcode:
  {% set v = printer["gcode_macro PLOT_START"] %}
  SET_GCODE_OFFSET X=0 Y=0 Z=0
  G28
  PEN_DOWN
  G90
  G1 Z{v.block_z} F600
  M400
  Z_PAPER_BLOCK
  SET_GCODE_OFFSET X={v.paper_x} Y={v.paper_y}
  M117 Pen resting on block. Seat pen, run PEN_UP, place paper, plot.

[gcode_macro PLOT_HEIGHT]
description: Lower Z to plotting height (work Z0 + plot_z) - run after removing the block
variable_plot_z: 0.0
gcode:
  {% if printer.gcode_move.homing_origin.z == 0.0 %}
    { action_raise_error("PLOT_HEIGHT: no paper-Z offset - run Z_PAPER_BLOCK first") }
  {% endif %}
  G90
  G1 Z{printer["gcode_macro PLOT_HEIGHT"].plot_z} F300
