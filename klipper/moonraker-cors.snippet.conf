# Merge these lines into the EXISTING [authorization] section of
# ~/printer_data/config/moonraker.conf on the Pi (viivain).
# Do NOT create a second [authorization] section.
# Restart Moonraker afterwards: sudo systemctl restart moonraker
#
# Purpose: allow the Muusia DRO websocket from local dev origins.
# 5173 = vite dev, 4173 = vite preview. Never use a bare * here, and never
# port-forward Moonraker (7125) or Mainsail (80) to the internet.

[authorization]
trusted_clients:
    192.168.0.0/24
    127.0.0.0/8
cors_domains:
    http://localhost:5173
    http://127.0.0.1:5173
    http://localhost:4173
