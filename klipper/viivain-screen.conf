# viivain-screen.conf — KlipperScreen menus for the Viivain pen plotter.
#
# Included from ~/printer_data/config/KlipperScreen.conf via
#   [include viivain-screen.conf]
# so KlipperScreen's own auto-generated section in that file survives.
# Version-controlled here (klipper/), live copy on the Pi. After editing:
#   scp + restart the KlipperScreen service (Moonraker manages it).
#
# Icons are file names in ~/KlipperScreen/styles/z-bolt/images/ (theme default).
# Panels: gcodes = file browser, move = jog + homing, gcode_macros = every
# macro not starting with "_" and without rename_existing.

[main]
# Replace the 3D-printer default menu entirely (no Temperature / Extrude / Fan).
use_default_menu: False
# Do not pop the Extrude panel open when a job pauses (pen change M0).
auto_open_extrude: False

# =============================================================================
# Idle menu (__main) — 8 buttons, no scrolling
# =============================================================================
[menu __main pen_up]
name: Pen Up
icon: arrow-up
method: printer.gcode.script
params: {"script":"PEN_UP"}
enable: {{ 'PEN_UP' in printer.gcode_macros.list }}

[menu __main pen_down]
name: Pen Down
icon: arrow-down
method: printer.gcode.script
params: {"script":"PEN_DOWN"}
enable: {{ 'PEN_DOWN' in printer.gcode_macros.list }}

[menu __main plot_start]
name: Plot Start
icon: printer
method: printer.gcode.script
params: {"script":"PLOT_START"}
enable: {{ 'PLOT_START' in printer.gcode_macros.list }}

[menu __main print]
name: Print
icon: files
panel: gcodes

[menu __main move]
name: Move
icon: move
panel: move

[menu __main macros]
name: Macros
icon: custom-script
panel: gcode_macros

[menu __main console]
name: Console
icon: console
panel: console

[menu __main more]
name: More
icon: settings

[menu __main more motors_off]
name: Motors Off
icon: motor-off
method: printer.gcode.script
params: {"script":"M84"}

[menu __main more pen_release]
name: Pen Release
icon: arrow-up
method: printer.gcode.script
params: {"script":"PEN_RELEASE"}
enable: {{ 'PEN_RELEASE' in printer.gcode_macros.list }}

[menu __main more restart_klipper]
name: Restart Klipper
icon: refresh
method: printer.restart
confirm: Restart Klipper? Paper zero and Z offset will be lost.

[menu __main more settings]
name: Settings
icon: settings
panel: settings

[menu __main more network]
name: Network
icon: network
panel: network

[menu __main more updater]
name: Update
icon: klipper
panel: updater

# =============================================================================
# Job menu (__print) — reached from the job status "menu" button, also while
# paused for a pen change. Resume / Cancel stay on the job status page itself.
# =============================================================================
[menu __print pen_up]
name: Pen Up
icon: arrow-up
method: printer.gcode.script
params: {"script":"PEN_UP"}
enable: {{ 'PEN_UP' in printer.gcode_macros.list }}

[menu __print pen_down]
name: Pen Down
icon: arrow-down
method: printer.gcode.script
params: {"script":"PEN_DOWN"}
enable: {{ 'PEN_DOWN' in printer.gcode_macros.list }}

[menu __print move]
name: Move
icon: move
panel: move

[menu __print macros]
name: Macros
icon: custom-script
panel: gcode_macros

[menu __print console]
name: Console
icon: console
panel: console
