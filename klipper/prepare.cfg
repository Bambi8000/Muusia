# Paper-loading position for Viivain. Included by printer.cfg.
# Runs once five seconds after Klipper becomes ready (including RESTART).
# PREPARE is also a touchscreen button. It always homes Z before XY through
# the existing homing_override, then parks at MACHINE X0 Y450, high Z, pen up.
# Paper/G92 offsets are cleared deliberately: run PRINT_START after loading
# paper to establish the existing fixed-block/paper calibration again.
# No file, pen-down, pause or resume is started by PREPARE.

[gcode_macro PREPARE]
description: Home and park at machine X0 Y450 for paper loading; wait for PRINT_START
variable_park_x: 0.0
variable_park_y: 450.0
variable_travel_f: 3600.0
gcode:
  {% set v = printer['gcode_macro PREPARE'] %}
  {% set needle = printer['gcode_macro _NEEDLE_MODE']|default({}) %}
  {% if printer.print_stats.state in ['printing', 'paused'] or printer.pause_resume.is_paused %}
    { action_raise_error('PREPARE: finish or cancel the current job first') }
  {% endif %}
  {% if needle.active|default(false) %}
    { action_raise_error('PREPARE: servo-pen workflow only; keep the needle calibration workflow') }
  {% endif %}
  {% if v.park_x < printer.toolhead.axis_minimum.x or v.park_x > printer.toolhead.axis_maximum.x or v.park_y < printer.toolhead.axis_minimum.y or v.park_y > printer.toolhead.axis_maximum.y %}
    { action_raise_error('PREPARE: parking position exceeds machine travel') }
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_MUUSIA_PREPARE_BOOT DURATION=0
  PEN_UP
  G28
  _PREPARE_PARK

[gcode_macro _PREPARE_PARK]
gcode:
  # This helper is evaluated AFTER G28, so its position is freshly homed.
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    { action_raise_error('PREPARE: homing did not complete') }
  {% endif %}
  {% set v = printer['gcode_macro PREPARE'] %}
  {% set pos = printer.gcode_move.position %}
  SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
  # Also clear any G92 shift: G-code coordinates now equal machine coordinates.
  G92 X{pos.x} Y{pos.y} Z{pos.z}
  G90
  G1 X{v.park_x} Y{v.park_y} F{v.travel_f}
  M400
  M117 Place paper, then run PRINT_START

[gcode_macro PRINT_START]
description: Seat the pen on the existing fixed block and set paper origin (PLOT_START)
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] or printer.pause_resume.is_paused %}
    { action_raise_error('PRINT_START: use the normal Resume / pen-change workflow during a job') }
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_MUUSIA_PREPARE_BOOT DURATION=0
  PLOT_START

[delayed_gcode _MUUSIA_PREPARE_BOOT]
initial_duration: 5.0
gcode:
  {% set needle = printer['gcode_macro _NEEDLE_MODE']|default({}) %}
  {% if printer.print_stats.state not in ['printing', 'paused'] and not printer.pause_resume.is_paused and not needle.active|default(false) %}
    PREPARE
  {% else %}
    RESPOND TYPE=echo MSG="Automatic PREPARE skipped: job or needle mode active"
  {% endif %}
